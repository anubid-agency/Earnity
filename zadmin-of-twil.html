<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Earnity admin: manage businesses, payouts and orders.">
<title>Admin – Earnity</title>
<meta name="theme-color" content="#0B4A1A">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Earnity">
<meta property="og:title" content="Earnity – Refer. Earn. Save.">
<meta property="og:description" content="Refer products, earn commission when your friends buy, and save with discounts. Uganda's referral marketplace.">
<meta property="og:image" content="https://earnityug.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Earnity – Refer. Earn. Save.">
<meta name="twitter:image" content="https://earnityug.com/og-image.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
:root{--green:#0b4a1a;--green-deep:#05301a;--orange:#f26b21;--orange-soft:#fff1e8;--mist:#f3f5f4;--line:#dfe5e1;--ink:#16201a;--muted:#5d6a62;--soft-green:#e3f1e7;--red:#b3261e;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;line-height:1.4;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:#fff;padding:10px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo img{height:50px;width:auto;display:block}
.acctbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--soft-green);color:var(--green);font-weight:700;font-size:13.5px}
.hero{position:relative;display:flex;align-items:center;min-height:30vh;color:#fff;background:linear-gradient(180deg,var(--green),var(--green-deep))}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,48,26,.30),rgba(5,48,26,.12) 45%,rgba(5,48,26,.50))}
.hero-in{position:relative;z-index:1;width:100%;max-width:1100px;margin:0 auto;padding:36px 14px;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.06;font-weight:800;letter-spacing:-.5px}
.hero p{margin-top:10px;font-size:clamp(15px,2.3vw,20px);opacity:.95;max-width:640px}
.chips{display:flex;gap:14px;overflow-x:auto;margin:16px 0 18px;padding:4px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.chip .pic{width:92px;height:92px;border-radius:22px;background:var(--mist);display:grid;place-items:center;border:2.5px solid transparent;transition:border-color .15s,transform .15s;color:var(--green);font-size:30px}
.chip .nm{font-size:13.5px;color:var(--muted);font-weight:500}
.chip:hover .pic{transform:translateY(-2px)}
.chip[aria-pressed="true"] .pic{border-color:var(--orange)}
.chip[aria-pressed="true"] .nm{color:var(--green);font-weight:700}
@media(min-width:700px){.chip{width:112px}.chip .pic{width:112px;height:112px}}
.fh{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px;font-size:16px}
.fh b{font-size:20px;font-weight:800}
.fh button{padding:8px 16px;border:1.5px solid var(--green);border-radius:999px;color:var(--green);font-size:14px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr);gap:16px}}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat small{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.stat small i{color:var(--green)}
.stat b{display:block;margin-top:6px;font-size:28px;font-weight:800;color:var(--green)}
.stat.warn{background:var(--orange-soft);border-color:transparent}
.stat.warn b,.stat.warn small i{color:var(--orange)}
.list{display:grid;gap:14px}
@media(min-width:800px){.list{grid-template-columns:1fr 1fr}}
.item{border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.item .ttl{font-weight:800;font-size:17px}
.item .sub{font-size:13px;color:var(--muted);word-break:break-all}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fact{background:var(--mist);border-radius:14px;padding:10px 12px}
.fact small{display:block;color:var(--muted);font-size:12.5px}
.fact b{display:block;margin-top:2px;font-size:14.5px;word-break:break-word}
.row2{display:flex;gap:10px;margin-top:14px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border:1.5px solid var(--green);border-radius:16px;font-weight:700;font-size:15px;color:var(--green)}
.act.main{background:var(--orange);border:0;color:#fff}
.act.buy{background:var(--green);border:0;color:#fff}
.act.bad{border-color:var(--red);color:var(--red)}
.act:disabled{opacity:.6}
.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--soft-green);color:var(--green)}
.badge.warn{background:var(--orange-soft);color:var(--orange)}
.badge.bad{background:#fdecea;color:#99231b}
.msg{text-align:center;color:var(--muted);padding:50px 10px}
.msg.err{color:var(--red)}
.sk{height:110px;border-radius:var(--radius);background:linear-gradient(90deg,var(--mist),#e8ece9,var(--mist));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.pad{padding-bottom:130px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:0 0 calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:30}
nav button{pointer-events:auto;width:60px;height:56px;border-radius:20px;background:var(--green);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(5,48,26,.35)}
nav button[aria-current="page"]{background:var(--orange)}
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:24px 24px 0 0;max-width:560px;margin:0 auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;visibility:hidden}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none;visibility:visible}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:19px;font-weight:800}
.sheet p{color:var(--muted);font-size:15px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}.sk{animation:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="/"><img src="/earnity.png" alt="Earnity" onerror="this.outerHTML='<div style=\'font-size:30px;font-family:Georgia,serif;color:var(--green)\'>Earni<span style=\'color:var(--orange)\'>ty</span></div>'"></a>
      <button class="acctbtn" id="logoutBtn" hidden><i class="fa-solid fa-right-from-bracket"></i>Sign out</button>
    </div>
  </div>
</header>

<section class="hero" aria-label="Admin">
  <div class="hero-in">
    <h1>Admin Console</h1>
    <p>Approve businesses, review payouts and keep every order moving.</p>
  </div>
</section>

<main class="wrap pad">
  <div class="msg" id="authState"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:24px;color:var(--green)"></i><p style="margin-top:12px">Signing in with Google...</p></div>
  <div id="app" hidden>
    <div class="chips" id="chips" aria-label="Sections"></div>
    <div class="fh"><b id="pageTitle">Dashboard</b><button id="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button></div>
    <div id="content"></div>
  </div>
</main>

<nav aria-label="Main">
  <button aria-current="page" aria-label="Dashboard" id="nHome"><i class="fa-solid fa-house"></i></button>
  <button aria-label="Visit site" id="nSite"><i class="fa-solid fa-store"></i></button>
  <button aria-label="Sign out" id="nOut"><i class="fa-solid fa-right-from-bracket"></i></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
const CFG = {
  ADMIN_API: "https://earnity-admin.anubisdigital114-9df.workers.dev",
  FIREBASE: {
    apiKey: "AIzaSyBImxDs7TBylV_FAFwYzzU7d9SFBV5BJtI",
    authDomain: "earnityug.firebaseapp.com",
    projectId: "earnityug",
    storageBucket: "earnityug.firebasestorage.app",
    messagingSenderId: "17057068015",
    appId: "1:17057068015:web:dc4d835783015b4247bc1a"
  }
};
const SECTIONS = [
  ["dashboard","Dashboard","fa-table-cells-large"],
  ["businesses","Businesses","fa-store"],
  ["payouts","Payouts","fa-coins"],
  ["orders","Orders","fa-bag-shopping"],
  ["users","Users","fa-user-group"]
];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US");
const ugx = v => "UGX " + fmt(v);
let S = { user: null, token: null, section: "dashboard" };

let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2800); }

/* confirm sheet */
function confirmSheet(title, text, okLabel, danger){
  return new Promise(res => {
    const sh = $("sheet");
    sh.innerHTML = `<div class="grab"></div><h2>${esc(title)}</h2><p>${esc(text)}</p>
      <div class="row2"><button class="act" data-x="0">Cancel</button><button class="act ${danger?"bad":"main"}" data-x="1">${esc(okLabel)}</button></div>`;
    document.body.classList.add("open");
    const done = v => { document.body.classList.remove("open"); $("scrim").onclick = null; res(v); };
    sh.onclick = e => { const b = e.target.closest("[data-x]"); if (b) done(b.dataset.x === "1"); };
    $("scrim").onclick = () => done(false);
  });
}

async function api(path, opt = {}) {
  const headers = { "Content-Type": "application/json" };
  if (S.token) headers.Authorization = "Bearer " + S.token;
  try {
    const res = await fetch(CFG.ADMIN_API + path, {
      method: opt.method || "GET", headers,
      body: opt.body ? JSON.stringify(opt.body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Request failed");
    return data;
  } catch (err) {
    if (err.message === "admin_only" || err.message === "not_registered") {
      $("content").innerHTML = `<div class="msg err"><b>Access denied</b><p>You do not have admin permissions.</p></div>`;
    } else toast("Error: " + err.message);
    throw err;
  }
}

/* chips + nav */
$("chips").innerHTML = SECTIONS.map(s => `<button class="chip" data-s="${s[0]}" aria-pressed="false"><span class="pic"><i class="fa-solid ${s[2]}"></i></span><span class="nm">${s[1]}</span></button>`).join("");
$("chips").onclick = e => { const c = e.target.closest(".chip"); if (c) loadSection(c.dataset.s); };
$("refresh").onclick = () => loadSection(S.section);
$("nHome").onclick = () => { loadSection("dashboard"); scrollTo({ top: 0, behavior: "smooth" }); };
$("nSite").onclick = () => { location.href = "/"; };

async function signOut(){
  const authMod = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
  await authMod.signOut(S.user.auth);
  location.reload();
}
$("logoutBtn").onclick = signOut;
$("nOut").onclick = () => { if (S.user) signOut(); };

async function init() {
  try {
    const V = "10.14.1";
    const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const auth = authMod.getAuth(appMod.initializeApp(CFG.FIREBASE));
    authMod.onAuthStateChanged(auth, async user => {
      if (user) {
        S.user = user;
        S.token = await user.getIdToken();
        $("authState").hidden = true;
        $("app").hidden = false;
        $("logoutBtn").hidden = false;
        loadSection("dashboard");
      } else {
        try { await authMod.signInWithPopup(auth, new authMod.GoogleAuthProvider()); }
        catch (e) { $("authState").innerHTML = `<p class="err" style="color:var(--red)">Login failed. Please refresh.</p>`; }
      }
    });
  } catch (e) {
    $("authState").innerHTML = `<p style="color:var(--red)">Failed to load authentication.</p>`;
  }
}

async function loadSection(section) {
  S.section = section;
  const meta = SECTIONS.find(s => s[0] === section);
  $("pageTitle").textContent = meta[1];
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.s === section));
  $("nHome").setAttribute("aria-current", section === "dashboard" ? "page" : "false");
  $("content").innerHTML = `<div class="list"><div class="sk"></div><div class="sk"></div></div>`;
  try {
    if (section === "dashboard") await renderDashboard();
    else if (section === "businesses") await renderBusinesses();
    else if (section === "payouts") await renderPayouts();
    else if (section === "orders") await renderOrders();
    else await renderUsers();
  } catch (e) {}
}

async function renderDashboard() {
  const { stats } = await api("/stats");
  const st = (ic, lb, v, w) => `<div class="stat ${w ? "warn" : ""}"><small><i class="fa-solid ${ic}"></i>${lb}</small><b>${fmt(v)}</b></div>`;
  $("content").innerHTML = `<div class="stats">
    ${st("fa-user-group","Total users",stats.total_users)}
    ${st("fa-store","Sellers",stats.total_sellers)}
    ${st("fa-share-nodes","Referees",stats.total_referees)}
    ${st("fa-circle-check","Active businesses",stats.active_businesses)}
    ${st("fa-clock","Pending businesses",stats.pending_businesses,1)}
    ${st("fa-bag-shopping","Total orders",stats.total_orders)}
    ${st("fa-hourglass-half","Awaiting payment",stats.pending_orders,1)}
    ${st("fa-coins","Pending payouts",stats.pending_payouts,1)}
  </div>`;
}

const fact = (l, v) => `<div class="fact"><small>${l}</small><b>${v}</b></div>`;

async function renderBusinesses() {
  const { businesses } = await api("/businesses?status=pending");
  if (!businesses.length) { $("content").innerHTML = `<div class="msg">No pending businesses.</div>`; return; }
  $("content").innerHTML = `<div class="list">${businesses.map(b => `
    <div class="item">
      <div class="ttl">${esc(b.name)}</div><div class="sub">${esc(b.subdomain)}</div>
      <div class="kv">
        ${fact("Owner", esc(b.owner_name) + `<br><span class="sub">${esc(b.owner_email)}</span>`)}
        ${fact("Category", esc(b.category_id))}
        ${fact("Date", new Date(b.created_at * 1000).toLocaleDateString())}
      </div>
      <div class="row2">
        <button class="act bad" data-biz="${esc(b.id)}" data-a="suspended">Reject</button>
        <button class="act buy" data-biz="${esc(b.id)}" data-a="approved">Approve</button>
      </div>
    </div>`).join("")}</div>`;
}

async function renderPayouts() {
  const { payouts } = await api("/payouts?status=awaiting_approval");
  if (!payouts.length) { $("content").innerHTML = `<div class="msg">No pending payouts.</div>`; return; }
  $("content").innerHTML = `<div class="list">${payouts.map(p => `
    <div class="item">
      <div class="ttl">${esc(p.display_name)}</div><div class="sub">${esc(p.email)}</div>
      <div class="kv">
        ${fact("Amount", ugx(p.amount_ugx))}
        ${fact("Fee", ugx(p.fee_ugx))}
        ${fact("Net payout", ugx(p.net_ugx))}
      </div>
      <div class="row2">
        <button class="act bad" data-pay="${esc(p.id)}" data-a="rejected">Reject</button>
        <button class="act main" data-pay="${esc(p.id)}" data-a="ready_to_pay">Approve</button>
      </div>
    </div>`).join("")}</div>`;
}

async function renderOrders() {
  const { orders } = await api("/orders?status=paid");
  if (!orders.length) { $("content").innerHTML = `<div class="msg">No paid orders currently active.</div>`; return; }
  const cls = s => s === "paid" || s === "approved" ? "" : (s === "pending" ? "warn" : "bad");
  $("content").innerHTML = `<div class="list">${orders.map(o => `
    <div class="item">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
        <div><div class="ttl">${esc(o.product_name)}</div><div class="sub">${esc(o.order_number)}</div></div>
        <span class="badge ${cls(o.status)}">${esc(o.status)}</span>
      </div>
      <div class="kv">
        ${fact("Buyer", esc(o.buyer_name))}
        ${fact("Seller", esc(o.seller_name))}
        ${fact("Amount", ugx(o.total_charged_ugx))}
      </div>
    </div>`).join("")}</div>`;
}

async function renderUsers() {
  $("content").innerHTML = `<div class="msg">User management requires a search feature. Coming soon.</div>`;
}

$("content").addEventListener("click", async e => {
  const b = e.target.closest("[data-biz],[data-pay]"); if (!b) return;
  const a = b.dataset.a, danger = a === "suspended" || a === "rejected";
  if (b.dataset.biz) {
    if (!await confirmSheet(a === "approved" ? "Approve business" : "Reject business", `Mark this business as ${a}?`, a === "approved" ? "Approve" : "Reject", danger)) return;
    b.disabled = true;
    try { await api("/businesses/action", { method: "POST", body: { business_id: b.dataset.biz, action: a } }); toast("Business " + a); } catch {}
    loadSection("businesses");
  } else {
    if (!await confirmSheet(a === "ready_to_pay" ? "Approve payout" : "Reject payout", `Mark this payout as ${a}?`, a === "ready_to_pay" ? "Approve" : "Reject", danger)) return;
    b.disabled = true;
    try { await api("/payouts/action", { method: "POST", body: { payout_id: b.dataset.pay, action: a } }); toast("Payout updated"); } catch {}
    loadSection("payouts");
  }
});

init();
</script>
</body>
</html>
