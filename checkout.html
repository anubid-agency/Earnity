<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Complete your Earnity order.">
<title>Checkout · Earnity</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
/* set the theme before first paint so there is no flash */
try{ if(localStorage.getItem('eu_theme')==='dark') document.documentElement.classList.add('dark'); }catch(e){}
</script>
<style>
:root{
  --green:#0b4a1a; --green-deep:#05301a; --orange:#f26b21; --orange-soft:#fff1e8;
  --mist:#f3f5f4; --line:#dfe5e1; --ink:#16201a; --muted:#5d6a62; --soft-green:#e3f1e7; --red:#b3261e;
  --radius:18px;
  --bg:#ffffff; --card:#ffffff;
  --btn:#b8480c; --btn-ink:#ffffff;
  --ok-bg:#e3f1e7; --ok-fg:#0b4a1a;
  --bad-bg:#fdecea; --bad-fg:#99231b;
  --warn-bg:#fff0dd; --warn-fg:#7a4204;
  --info-bg:#e8f0f8; --info-fg:#1d4f7a;
}
html.dark{
  --green:#8fe3ae; --green-deep:#04150c; --orange:#ff9a5c; --orange-soft:#3a2013;
  --mist:#151d18; --line:#2a352e; --ink:#eaf1ec; --muted:#a4b3a9; --soft-green:#16301f; --red:#ffb2a6;
  --bg:#0a100c; --card:#101713;
  --btn:#ff9a5c; --btn-ink:#1d1108;
  --ok-bg:#12301e; --ok-fg:#a7ecc0;
  --bad-bg:#3a1814; --bad-fg:#ffb2a6;
  --warn-bg:#3a2810; --warn-fg:#ffd08f;
  --info-bg:#14283a; --info-fg:#a9cdf0;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.4;min-height:100vh;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--green);text-decoration:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%;display:block}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* header */
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;padding:9px 0}
.logo{display:flex;align-items:center;flex:none;text-decoration:none}
.logo img{height:32px;width:auto;max-width:104px}
.wordmark{font-family:Georgia,serif;font-size:25px;font-weight:600;color:var(--green);line-height:1}
.wordmark span{color:var(--orange)}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:17px}
.iconbtn:hover{background:var(--mist)}
.hright{display:flex;align-items:center;gap:4px;margin-left:auto;min-width:0}
.acctbtn{display:inline-flex;align-items:center;justify-content:center;padding:0 14px;height:40px;border-radius:999px;
  background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:13.5px;max-width:120px;margin-left:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:64px}
@media(max-width:420px){ .logo{display:none} }

/* main */
main{padding:24px 0 48px}
.card{max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px}
.center{text-align:center}
.icon-big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:26px}
.icon-big.ok{background:var(--ok-bg);color:var(--ok-fg)}
.icon-big.bad{background:var(--bad-bg);color:var(--bad-fg)}
.icon-big.warn{background:var(--warn-bg);color:var(--warn-fg)}
.icon-big.spin{background:var(--soft-green);color:var(--green)}
h1{font-size:20px;color:var(--green-deep);font-weight:800;line-height:1.25}
.sub{color:var(--muted);font-size:14.5px;margin-top:10px;line-height:1.5}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;
  border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;width:100%}
.btn.solid{background:var(--btn);color:var(--btn-ink)}
.btn.line{border:1.5px solid var(--green);color:var(--green);background:transparent}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:18px}

.hint{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.5;text-align:center}
.inline-err{color:var(--bad-fg);background:var(--bad-bg);font-size:13.5px;margin-top:14px;padding:10px 14px;
  border-radius:12px;text-align:left;line-height:1.45}

/* summary (checkout) */
.summary{margin-top:18px;padding:12px 14px;background:var(--mist);border-radius:14px;font-size:14px}
.summary .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.summary .row span{color:var(--muted)}
.summary .row b{font-weight:700}
.summary .row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-size:15px}
.summary .row.total b{color:var(--green-deep);font-weight:800}

.timer{margin-top:16px;font-size:14px;color:var(--orange);font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;
  max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="index.html" aria-label="Earnity home">
        <img src="earnity.png" alt="Earnity" id="logoImg">
      </a>
      <div class="hright">
        <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch to dark theme" aria-pressed="false">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
        <a class="acctbtn" id="acctBtn" href="account.html" hidden>Account</a>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="stage" aria-live="polite" aria-atomic="true"></section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* ================= CONFIG ================= */
const CFG = {
  API:      "https://earnity-api.anubisdigital114-9df.workers.dev",
  PAYMENTS: "https://earnity-payments.anubisdigital114-9df.workers.dev",
  FIREBASE: {
    apiKey: "AIzaSyBImxDs7TBylV_FAFwYzzU7d9SFBV5BJtI",
    authDomain: "earnityug.firebaseapp.com",
    projectId: "earnityug",
    storageBucket: "earnityug.firebasestorage.app",
    messagingSenderId: "17057068015",
    appId: "1:17057068015:web:dc4d835783015b4247bc1a"
  }
};

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ugx = v => {
  const n = Number(v);
  return Number.isFinite(n) ? "UGX " + Math.round(n).toLocaleString("en-US") : "";
};

/* ================= STATE ================= */
const S = {
  user: null,
  me: null,
  orderId: null,
  order: null,
  nextUrl: null,
  timerId: null
};

/* ================= THEME ================= */
function setTheme(dark) {
  document.documentElement.classList.toggle("dark", dark);
  const b = $("themeBtn");
  if (b) {
    b.innerHTML = `<i class="fa-solid ${dark ? "fa-sun" : "fa-moon"}" aria-hidden="true"></i>`;
    b.setAttribute("aria-pressed", dark ? "true" : "false");
    b.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  }
  try { localStorage.setItem("eu_theme", dark ? "dark" : "light"); } catch {}
}

/* ================= TOAST ================= */
let toastT = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), 3000);
}

/* ================= API ================= */
async function api(base, path, opt = {}) {
  const h = {};
  if (opt.body !== undefined) h["Content-Type"] = "application/json";
  try {
    if (S.user) h.Authorization = "Bearer " + await S.user.getIdToken();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 15000);
    const r = await fetch(base + path, {
      method: opt.method || "GET",
      headers: h,
      body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined,
      signal: ctl.signal,
      cache: "no-store"
    });
    clearTimeout(timer);
    let data = null;
    try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data: data || {} };
  } catch {
    return { ok: false, status: 0, data: { error: "network" } };
  }
}

/* ================= UI PRIMITIVES ================= */
function showSpinner(msg) {
  const stage = $("stage");
  stage.innerHTML = `
    <div class="card center">
      <div class="icon-big spin"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i></div>
      <h1>${esc(msg || "Loading…")}</h1>
    </div>`;
}

function showError(opts) {
  const buttons = (opts.buttons || []).map((b, i) => {
    if (b.href) return `<a class="btn ${b.cls || "solid"}" href="${esc(b.href)}">${esc(b.label)}</a>`;
    return `<button type="button" class="btn ${b.cls || "solid"}" data-btn="${i}">${esc(b.label)}</button>`;
  }).join("");
  const stage = $("stage");
  stage.innerHTML = `
    <div class="card center">
      <div class="icon-big ${esc(opts.tone || "bad")}"><i class="fa-solid ${esc(opts.icon || "fa-triangle-exclamation")}" aria-hidden="true"></i></div>
      <h1>${esc(opts.title || "Something went wrong")}</h1>
      <p class="sub">${esc(opts.body || "")}</p>
      ${buttons ? `<div class="btnrow">${buttons}</div>` : ""}
    </div>`;
  (opts.buttons || []).forEach((b, i) => {
    if (!b.href && typeof b.onclick === "function") {
      const el = stage.querySelector(`[data-btn="${i}"]`);
      if (el) el.addEventListener("click", b.onclick);
    }
  });
}

function inlineError(id, msg) {
  const el = $(id);
  if (!el) return;
  if (!msg) { el.hidden = true; el.textContent = ""; el.className = ""; return; }
  el.hidden = false;
  el.className = "inline-err";
  el.textContent = msg;
}

/* ================= BOOT ================= */
async function boot() {
  const params = new URLSearchParams(location.search);
  S.orderId = (params.get("order") || "").trim();
  S.nextUrl = location.pathname + location.search;

  if (!S.orderId) {
    showError({
      icon: "fa-link-slash", tone: "bad",
      title: "No order found",
      body: "The checkout link is missing an order ID. Please go back to the product page and try again.",
      buttons: [{ label: "Go to shop", href: "index.html", cls: "solid" }]
    });
    return;
  }

  /* init firebase auth */
  let user = null;
  try {
    const V = "10.14.1";
    const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const app = appMod.getApps && appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(CFG.FIREBASE);
    const auth = authMod.getAuth(app);
    user = await new Promise(resolve => {
      const off = authMod.onAuthStateChanged(auth, u => { off(); resolve(u || null); });
      setTimeout(() => resolve(null), 12000);
    });
  } catch {}

  if (!user) {
    location.replace("account.html?next=" + encodeURIComponent(S.nextUrl));
    return;
  }
  S.user = user;

  /* GET /me */
  const me = await api(CFG.API, "/me");
  if (!me.ok) {
    if (me.status === 404 || me.status === 401) {
      location.replace("account.html?next=" + encodeURIComponent(S.nextUrl));
      return;
    }
    showError({
      icon: "fa-triangle-exclamation", tone: "bad",
      title: "Couldn't load your account",
      body: "Check your connection and try again.",
      buttons: [{ label: "Try again", cls: "solid", onclick: () => boot() }]
    });
    return;
  }
  S.me = me.data.user;
  
  const acctBtn = $("acctBtn");
  if (acctBtn) {
    const first = String(S.me.display_name || "").split(" ")[0] || "Account";
    acctBtn.textContent = first;
    acctBtn.href = "index.html";
    acctBtn.hidden = false;
  }

  /* Fetch Order Details */
  loadOrder();
}

/* ================= LOAD ORDER ================= */
async function loadOrder() {
  showSpinner("Loading order details…");

  /* CHANGE THIS IF NEEDED: The endpoint that fetches order details for checkout */
  const r = await api(CFG.API, `/orders/view?id=${S.orderId}`);
  
  if (!r.ok) {
    if (r.status === 404) {
      showError({
        icon: "fa-circle-question", tone: "bad",
        title: "Order not found",
        body: "This order doesn't exist or belongs to a different account.",
        buttons: [{ label: "Go to shop", href: "index.html", cls: "solid" }]
      });
      return;
    }
    showError({
      icon: "fa-triangle-exclamation", tone: "bad",
      title: "Couldn't load order",
      body: "Check your connection and try again.",
      buttons: [{ label: "Try again", cls: "solid", onclick: () => loadOrder() }]
    });
    return;
  }

  S.order = r.data.order || r.data;
  
  if (S.order.status !== "awaiting_payment") {
    showError({
      icon: "fa-circle-check", tone: "ok",
      title: "Order already processed",
      body: `This order is currently ${S.order.status}.`,
      buttons: [{ label: "View order", href: `order.html?id=${S.orderId}`, cls: "solid" }]
    });
    return;
  }

  const timeLeft = Number(S.order.expires_at) - Math.floor(Date.now() / 1000);
  if (timeLeft <= 0) {
    showError({
      icon: "fa-clock", tone: "warn",
      title: "Order expired",
      body: "You took too long to pay. Please go back and place a new order.",
      buttons: [{ label: "Go to shop", href: "index.html", cls: "solid" }]
    });
    return;
  }

  renderCheckout(timeLeft);
}

/* ================= RENDER CHECKOUT ================= */
function renderCheckout(initialTimeLeft) {
  const stage = $("stage");
  const o = S.order;
  
  const rows = [];
  rows.push(["Item", o.product_name]);
  if (o.price_ugx) rows.push(["Price", ugx(o.price_ugx)]);
  if (o.discount_ugx && o.discount_ugx > 0) rows.push(["Discount", "-" + ugx(o.discount_ugx)]);
  if (o.delivery_fee_ugx && o.delivery_fee_ugx > 0) rows.push(["Delivery", ugx(o.delivery_fee_ugx)]);
  if (o.payment_fee_ugx && o.payment_fee_ugx > 0) rows.push(["Payment fee", ugx(o.payment_fee_ugx)]);
  
  const total = o.total_charged_ugx || o.buyer_price_ugx;

  stage.innerHTML = `
    <div class="card">
      <div class="center">
        <div class="icon-big spin" style="background:var(--orange-soft);color:var(--orange)">
          <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
        </div>
        <h1>Complete your order</h1>
      </div>
      
      <div class="summary">
        ${rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}
        <div class="row total"><span>Total</span><b>${ugx(total)}</b></div>
      </div>

      <div class="timer" id="timer">
        <i class="fa-solid fa-stopwatch" aria-hidden="true"></i>
        <span id="timerText">Calculating...</span>
      </div>

      <div class="btnrow">
        <button type="button" class="btn solid" id="payBtn">
          Pay ${ugx(total)} with Pesapal
        </button>
      </div>
      <p class="hint">You will be redirected to Pesapal to complete the payment securely.</p>
    </div>`;

  /* Timer Logic */
  const timerEl = $("timerText");
  let timeLeft = initialTimeLeft;

  function tick() {
    if (timeLeft <= 0) {
      clearInterval(S.timerId);
      $("payBtn").disabled = true;
      $("payBtn").textContent = "Order expired";
      showError({
        icon: "fa-clock", tone: "warn",
        title: "Order expired",
        body: "You took too long to pay. Please place a new order.",
        buttons: [{ label: "Go to shop", href: "index.html", cls: "solid" }]
      });
      return;
    }
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    timerEl.textContent = `Expires in ${m}:${String(s).padStart(2, "0")}`;
    timeLeft--;
  }
  
  tick();
  S.timerId = setInterval(tick, 1000);

  /* Pay Button */
  $("payBtn").addEventListener("click", () => startPayment(total));
}

/* ================= START PAYMENT ================= */
async function startPayment(amount) {
  const btn = $("payBtn");
  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Redirecting…`;

  const r = await api(CFG.PAYMENTS, "/payments/start", {
    method: "POST",
    body: { order_id: S.orderId }
  });

  if (r.ok && r.data.redirect_url) {
    location.href = r.data.redirect_url;
    return;
  }

  btn.disabled = false;
  btn.textContent = `Pay ${ugx(amount)} with Pesapal`;

  const e = String((r.data && r.data.error) || "");
  let msg = "Could not start payment. Please try again.";
  if (e === "rate_limit_exceeded") msg = "Too many payment attempts. Please wait a few minutes.";
  else if (e === "order_not_found") msg = "This order no longer exists.";
  else if (e === "phone_not_verified") msg = "Please verify your phone number in your account first.";
  
  showError({
    icon: "fa-triangle-exclamation", tone: "bad",
    title: "Payment failed",
    body: msg,
    buttons: [
      { label: "Try again", cls: "solid", onclick: () => startPayment(amount) },
      { label: "Back to order", cls: "line", href: `order.html?id=${S.orderId}` }
    ]
  });
}

/* ================= WIRE UP ================= */
setTheme(document.documentElement.classList.contains("dark"));
$("themeBtn").addEventListener("click", () => setTheme(!document.documentElement.classList.contains("dark")));

const logoImg = $("logoImg");
if (logoImg) logoImg.addEventListener("error", () => {
  const a = logoImg.parentElement;
  if (a) a.innerHTML = '<span class="wordmark">Earni<span>ty</span></span>';
});

/* ================= START ================= */
boot().catch(err => {
  console.error("boot_failed", { name: err && err.name });
  showError({
    icon: "fa-triangle-exclamation", tone: "bad",
    title: "Couldn't start",
    body: "Please refresh the page.",
    buttons: [{ label: "Refresh", cls: "solid", onclick: () => location.reload() }]
  });
});
</script>
</body>
</html>
