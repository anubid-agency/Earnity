<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Earnity seller dashboard: products, orders, earnings and your public store.">
<meta name="robots" content="noindex, nofollow">
<title>Business · Earnity</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
 <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<style>
:root{
  --green:#0b4a1a; --green-deep:#05301a; --orange:#f26b21; --orange-soft:#fff1e8;
  --mist:#f3f5f4; --line:#dfe5e1; --ink:#16201a; --muted:#5d6a62; --soft-green:#e3f1e7; --red:#b3261e; --amber:#8a5a00;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--mist);line-height:1.4;
  min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%;display:block}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:760px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar img{height:44px;width:auto;display:block}
.bar .r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13.5px;text-decoration:none;
  background:var(--soft-green);color:var(--green);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:17px}
.icon:hover{background:var(--mist)}

.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:19}
.tabs .in{max-width:760px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.tabs .in::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:13px 12px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--green);border-color:var(--orange)}

main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
h1{font-size:22px;color:var(--green-deep)}
h2{font-size:17px;color:var(--green-deep)}
.sub{color:var(--muted);font-size:14.5px;margin-top:4px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hd .b{font-size:14px;font-weight:700;color:var(--green)}
.hd h2{display:flex;align-items:center;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none}
.btn.solid{background:var(--orange);color:#fff}
.btn.line{border:1.5px solid var(--green);color:var(--green);background:#fff}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 16px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--green);font-weight:600;font-size:14px;text-decoration:underline;padding:8px 2px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{display:block;font-size:24px;margin-top:2px;color:var(--green-deep)}
.stat.hi{background:var(--green);border-color:var(--green)}
.stat.hi small{color:#cfe6d6}
.stat.hi b{color:#fff}

.banner{padding:12px 14px;border-radius:14px;font-size:14.5px;margin-bottom:14px;background:var(--orange-soft);color:#7a3200}
.banner.err{background:#fdecea;color:var(--red)}
.banner.ok{background:var(--soft-green);color:var(--green-deep)}

.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item:first-child{padding-top:0}
.item .t{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .m{color:var(--muted);font-size:13.5px;margin-top:3px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--mist);color:var(--muted)}
.chip.good{background:var(--soft-green);color:var(--green)}
.chip.warn{background:var(--orange-soft);color:var(--orange)}
.chip.bad{background:#fdecea;color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.earn{color:var(--green);font-weight:800}
.msg{margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--mist);font-size:14px;font-style:italic}

.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15px}
.empty i{display:block;font-size:30px;color:var(--line);margin-bottom:10px}
.center{display:flex;justify-content:center;padding:60px 0;color:var(--green);font-size:28px}

.sk{background:linear-gradient(90deg,var(--mist),var(--line),var(--mist));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:16px;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}

/* forms */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--ink)}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.field input[type=text],.field input[type=email],.field input[type=url],.field input[type=number],.field textarea,.field select{
  width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;color:var(--ink)}
.field textarea{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.4}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green);outline:0;box-shadow:0 0 0 3px var(--soft-green)}
.field input:disabled{background:var(--mist);color:var(--muted);cursor:not-allowed}
.inerr{font-size:13px;color:var(--red);margin-top:6px}
.counter{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0}
.checkbox-row input[type=checkbox]{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--green)}
.checkbox-row label{font-weight:500;font-size:14px;line-height:1.4}
.preview{font-size:13.5px;color:var(--muted);margin-top:5px}
.preview b{color:var(--green)}

/* scrim + sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:24px 24px 0 0;max-width:560px;margin:0 auto;
  max-height:90vh;overflow-y:auto;padding:12px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .25s ease;visibility:hidden}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none;visibility:visible}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:19px;font-weight:800;color:var(--green-deep)}
.sheet .sub{margin-top:4px}
.sheet .code{letter-spacing:8px;text-align:center;font-size:24px;font-weight:700}

/* radios */
.opts{border:0;margin-top:12px}
.opts legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.opt{display:flex;gap:12px;align-items:center;min-height:52px;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:14px;margin-bottom:8px;cursor:pointer;font-size:14.5px;line-height:1.35}
.opt:last-child{margin-bottom:0}
.opt.on{border-color:var(--orange);background:var(--orange-soft)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
.opt.on .radio{border-color:var(--orange)}
.opt.on .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--orange)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:var(--green-deep);color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;z-index:60;max-width:92vw;text-align:center;
  transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--mist);border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:grid;place-items:center}
.photo .ld{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.8);color:var(--green)}
.photo-add{aspect-ratio:1;border-radius:12px;background:var(--mist);border:1.5px dashed var(--line);color:var(--muted);display:grid;place-items:center;font-size:22px}
.photo-add:hover{border-color:var(--green);color:var(--green)}

.store-link{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--mist);border-radius:14px;font-size:14px;word-break:break-all;margin-top:10px}
.store-link i{color:var(--green);flex:none}

.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.filters::-webkit-scrollbar{display:none}
.filter{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;font-weight:600;white-space:nowrap}
.filter[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}

.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

@media(prefers-reduced-motion:reduce){.sk{animation:none}.toast,.sheet,.scrim{transition:none}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a href="/index.html" aria-label="Earnity home"><img src="/earnity.png" alt="Earnity" onerror="this.outerHTML='<b style=\'font-size:22px;color:#0b4a1a\'>Earnity</b>'"></a>
    <div class="r">
      <button class="icon" id="refresh" aria-label="Refresh"><i class="fa-solid fa-rotate"></i></button>
      <a class="pill" id="who" href="/account.html">Account</a>

</header>

<nav class="tabs" id="tabsWrap" aria-label="Sections" hidden>

    <button class="tab" role="tab" data-tab="orders" aria-selected="false">Orders</button>
    <button class="tab" role="tab" data-tab="earnings" aria-selected="false">Earnings</button>

</nav>

<main>

  <section id="p-overview" hidden></section>
  <section id="p-products" hidden></section>
  <section id="p-orders" hidden></section>
  <section id="p-earnings" hidden></section>
  <section id="p-store" hidden></section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US");
const num = v => { if (v === null || v === undefined || v === "") return null; const n = typeof v === "number" ? v : Number(String(v).replace(/[^0-9.\-]/g, "")); return Number.isFinite(n) ? n : null; };
const ugx = v => { const n = num(v); return n === null ? "—" : "UGX " + Math.round(n).toLocaleString("en-US"); };
const pct = bps => (Number(bps) / 100).toString();
const nowS = () => Math.floor(Date.now() / 1000);
const toUnix = dtLocal => { if (!dtLocal) return null; const d = new Date(dtLocal); return isNaN(d) ? null : Math.floor(d.getTime() / 1000); };
const KLA = "Africa/Kampala";
function toDate(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") { const d = new Date(v < 1e12 ? v * 1000 : v); return isNaN(d) ? null : d; }
  const s = String(v).trim();
  if (/^\d+$/.test(s)) { const n = Number(s); const d = new Date(n < 1e12 ? n * 1000 : n); return isNaN(d) ? null : d; }
  const d = new Date(s); return isNaN(d) ? null : d;
}
const dt = v => { const d = toDate(v); if (!d) return ""; try { return new Intl.DateTimeFormat("en-GB", { timeZone: KLA, day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).format(d); } catch { return ""; } };
const dOnly = v => { const d = toDate(v); if (!d) return ""; try { return new Intl.DateTimeFormat("en-GB", { timeZone: KLA, day: "numeric", month: "short", year: "numeric" }).format(d); } catch { return ""; } };
const dtLocalInput = v => { const d = toDate(v); if (!d) return ""; const pad = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const ERR = {
  network: "Can't reach Earnity. Check your connection and try again.",
  unauthorized: "Please sign in again.", invalid_token: "Your sign-in expired. Please sign in again.",

  invalid_price: "Enter a valid price.",

  offer_price_not_lower: "The offer price must be lower than the current price.",
  invalid_offer_range: "Offer dates must be valid and in the right order.",
  offer_too_long: "Offers can run for at most 30 days.",
  invalid_order_status: "This order can't be marked delivered right now.",
  wrong_code: "That code isn't right.",

  already_disputed: "A problem report is already open on this order.",
  not_disputable: "You can't report a problem at this stage.",

  message_too_long: "Your message is too long. Keep it under 500 characters.",
  /* withdrawals */
  invalid_amount: "Enter a valid amount.", payouts_disabled: "Withdrawals are paused right now. Please try again later.",
  below_minimum: "That's below the minimum withdrawal.", amount_too_small_for_fee: "That amount is too small to cover the fee.",
  payout_hold_active: "Withdrawals are on hold after a phone change.", phone_not_verified: "Verify your phone number first.",

function errMsg(r) {
  if (!r) return "Something went wrong.";
  if (r.status === 0 && r.data && r.data.error === "cloudinary") return "Cloudinary: " + (r.data.message || "upload failed.");
  if (r.status === 0 && (!r.data || r.data.error === "network")) return ERR.network;
  const e = r.data && r.data.error;
  if (e === "payout_hold_active" && r.data.payout_hold_until) return "Withdrawals are on hold until " + dt(r.data.payout_hold_until) + " after a phone change.";
  if (e === "cloudinary") return "Cloudinary: " + (r.data.message || "upload failed.");
  if (e && ERR[e]) return ERR[e];
  if (r.status === 401) return ERR.unauthorized;
  if (r.status === 429) return ERR.rate_limit_exceeded;

}
/* ================= TOAST ================= */
let toastT = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200);
}

/* ================= SHEET ================= */
const sheet = $("sheet");
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="grab"></div>` + html;
  sheet.hidden = false;
  document.body.classList.add("open");
  setTimeout(() => {
    const f = sheet.querySelector("[data-autofocus]") || sheet.querySelector("input, textarea, select, button, a[href]");
    if (f && f.focus) try { f.focus(); } catch {}
  }, 60);
}
function closeSheet() {
  document.body.classList.remove("open");
  setTimeout(() => { if (!document.body.classList.contains("open")) { sheet.hidden = true; sheet.innerHTML = ""; } }, 300);
  if (lastFocus && document.contains(lastFocus) && lastFocus.focus) { try { lastFocus.focus(); } catch {} }
  lastFocus = null;
}
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if (!document.body.classList.contains("open")) return;

  const f = Array.from(sheet.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select,[tabindex]:not([tabindex="-1"])')).filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
sheet.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(); });

const S = {
  user: null, me: null, tab: "overview", cloudName: null, cats: null,
  overview: { loading: false, loaded: false, error: null, data: null },
  products: { loading: false, loaded: false, error: null, data: null },
  orders: { loading: false, loaded: false, error: null, data: null, filter: "", cursor: null, done: false, loadingMore: false },
  earn: { loading: false, loaded: false, error: null, wallet: null, entries: [], next: null, payouts: null, settings: null, hold: null, phoneCount: null, loadingMore: false },
  store: { loading: false, loaded: false, error: null, data: null }
};

async function api(base, path, opt = {}) {
  const h = {};
  if (opt.body !== undefined) h["Content-Type"] = "application/json";
  try {
    if (S.user) h.Authorization = "Bearer " + await S.user.getIdToken();
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 15000);
    const r = await fetch(base + path, {
      method: opt.method || "GET",
      headers: h,
      body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined,
      signal: ctl.signal
    });
    clearTimeout(t);
    let data = null; try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data: data || {} };
  } catch {
    return { ok: false, status: 0, data: { error: "network" } };
  }
}

function showOnly(id) {
  ["loading","gate","p-overview","p-products","p-orders","p-earnings","p-store"].forEach(x => {

  });
}
function gate(html) { $("tabsWrap").hidden = true; $("gate").innerHTML = html; showOnly("gate"); }
function setTab(t) {
  S.tab = t;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  showOnly("p-" + t);
  scrollTo({ top: 0 });
  if (t === "overview" && !S.overview.loaded) loadOverview();
  else if (t === "products" && !S.products.loaded) loadProducts();
  else if (t === "orders" && !S.orders.loaded) loadOrders();

  else if (t === "store" && !S.store.loaded) loadStore();
}

function skel(n = 3, h = 80) {

/* ================= AUTH + INIT ================= */
async function boot() {
  let u = null;
  try {
    const V = "10.14.1";
    const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const app = appMod.getApps && appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(CFG.FIREBASE);
    const auth = authMod.getAuth(app);
    u = await new Promise(resolve => {
      const off = authMod.onAuthStateChanged(auth, usr => { off(); resolve(usr || null); });
      setTimeout(() => resolve(null), 10000);
    });
  } catch {}
  if (!u) { location.replace("/account.html?next=" + encodeURIComponent(THIS)); return; }
  S.user = u;
  const r = await api(CFG.API, "/me");
  if (!r.ok) {
    if (r.status === 401) { location.replace("/account.html?next=" + encodeURIComponent(THIS)); return; }
    return gate(`<div class="card"><h2>Couldn't load your account</h2>
      <p class="sub">${esc(errMsg(r))}</p>
      <div class="row"><button class="btn solid" onclick="location.reload()">Try again</button></div></div>`);
  }
  if (r.data.error === "not_registered") { location.replace("/account.html?next=" + encodeURIComponent(THIS)); return; }
  S.me = r.data.user;
  $("who").textContent = String(S.me.display_name || "Account").split(" ")[0];
  if (S.me.account_type !== "seller") {
    return gate(`<div class="card"><h2>This page is for seller accounts</h2>
      <p class="sub">You're signed in as a ${esc(S.me.account_type)}. Seller tools are only available on seller accounts.</p>
      <div class="row"><a class="btn solid" href="/index.html">Go to home</a><a class="btn line" href="/account.html">My account</a></div></div>`);
  }
  $("loading").hidden = true;
  $("tabsWrap").hidden = false;
  setTab("overview");
}

async function loadOverview(force) {
  if (S.overview.loading) return;
  if (S.overview.loaded && !force) return;
  S.overview.loading = true; S.overview.error = null;
  renderOverview();
  const r = await api(CFG.CATALOG, "/business/me");
  S.overview.loading = false;
  if (r.status === 404 && r.data.error === "business_not_found") {
    S.overview.data = null; S.overview.loaded = true;
  } else if (!r.ok) {
    S.overview.error = r;
  } else {
    S.overview.data = r.data.business || r.data;
    S.overview.loaded = true;
  }
  renderOverview();
}

function fieldErr(id, msg) { const el = $(id); if (el) { el.textContent = msg || ""; el.hidden = !msg; } }

async function submitSetup(e) {
  e.preventDefault();
  ["eName","eSub","eRef","eForm"].forEach(id => fieldErr(id, ""));
  const name = $("fName").value.trim();
  const sub = $("fSub").value.trim().toLowerCase();
  const desc = $("fDesc").value.trim();
  const cat = $("fCat").value;
  const dtxt = $("fDelivText").value.trim();
  const ddays = Number($("fDelivDays").value);
  const addr = $("fAddr").value.trim();
  const url = $("fUrl").value.trim();
  const ref = $("fRef").value.trim();
  const terms = $("fTerms").checked;

  if (name.length < 2 || name.length > 120) { fieldErr("eName", "Between 2 and 120 characters."); return; }
  const subErr = validateSubdomain(sub);
  if (subErr) { fieldErr("eSub", subErr); return; }
  if (!terms) { fieldErr("eForm", ERR.terms_not_accepted); return; }
  if (!cat) { fieldErr("eForm", "Pick a category."); return; }
  if (!Number.isFinite(ddays) || ddays < 1 || ddays > 14) { fieldErr("eForm", ERR.invalid_delivery_days); return; }
  if (url && !/^https?:\/\//i.test(url)) { fieldErr("eForm", "Online link must start with http:// or https://"); return; }

  const body = {
    name, subdomain: sub,
    description: desc || undefined,
    category_id: cat,
    delivery_text: dtxt || undefined,
    default_delivery_days: ddays,
    address_text: addr || undefined,
    online_presence_url: url || undefined,
    referrer_username: ref || undefined,
    accept_seller_terms: true
  };
  const btn = $("fGo"); btn.disabled = true; btn.textContent = "Creating…";
  const r = await api(CFG.CATALOG, "/business", { method: "POST", body });
  btn.disabled = false; btn.textContent = "Create business";
  if (r.ok) {
    toast("Business created");
    S.overview.loaded = false; S.products.loaded = false; S.orders.loaded = false; S.earn.loaded = false; S.store.loaded = false;
    await loadOverview(true);
    return;
  }
  const er = String(r.data && r.data.error);
  if (er === "subdomain_taken") { fieldErr("eSub", ERR.subdomain_taken); return; }
  if (er === "business_exists") { fieldErr("eForm", ERR.business_exists); return; }
  if (er === "terms_not_accepted") { fieldErr("eForm", ERR.terms_not_accepted); return; }
  if (er === "referrer_not_found") { fieldErr("eRef", ERR.referrer_not_found); return; }
  if (er === "referrer_is_owner") { fieldErr("eRef", ERR.referrer_is_owner); return; }
  if (er === "invalid_category") { fieldErr("eForm", ERR.invalid_category); return; }
  if (er === "invalid_delivery_days") { fieldErr("eForm", ERR.invalid_delivery_days); return; }
  fieldErr("eForm", errMsg(r));
}

function validateSubdomain(v) {
  if (!v) return "Required.";
  if (v.length < 3) return "Use 3 to 30 letters, numbers or hyphens.";
  if (v.length > 30) return "Use 3 to 30 letters, numbers or hyphens.";
  if (!/^[a-z0-9](?:[a-z0-9-]{1,28}[a-z0-9])?$/.test(v)) return "Use 3 to 30 letters, numbers or hyphens.";
  if (RESERVED.has(v)) return "This store link is reserved.";
  return null;
}

  return S.cats || [];

/* ================= MEDIA upload ================= */

async function uploadMedia(file, purpose, productId) {
  if (!file) return { ok: false, error: { status: 0, step: "validate", data: { error: "no_file" } } };
  if (!/^image\//.test(file.type)) return { ok: false, error: { status: 0, step: "validate", data: { error: "invalid_file_type" } } };
  if (file.size > 5 * 1024 * 1024) return { ok: false, error: { status: 0, step: "validate", data: { error: "file_too_large" } } };
  const signBody = { purpose };
  if (productId) signBody.product_id = productId;
  const sign = await api(CFG.MEDIA, "/uploads/sign", { method: "POST", body: signBody });
  if (!sign.ok) {
    const step = sign.status === 0 ? "network" : "sign";
    return { ok: false, error: { status: sign.status, step, data: sign.data || {} } };
  }
  const d = sign.data;
  if (d.cloud_name) S.cloudName = d.cloud_name;
  if (typeof d.remaining_slots === "number" && d.remaining_slots <= 0) {
    return { ok: false, error: { status: 400, step: "sign", data: { error: "no_slots" } } };
  }
  const fd = new FormData();
  fd.append("file", file);
  fd.append("api_key", d.api_key);
  fd.append("timestamp", String(d.timestamp));
  fd.append("signature", d.signature);
  fd.append("public_id", d.public_id);
  fd.append("upload_preset", d.upload_preset);
  let up, upData = null, netFail = false;
  try {
    up = await fetch(d.upload_url, { method: "POST", body: fd });
    try { upData = await up.json(); } catch {}
  } catch { netFail = true; }
  if (netFail || !up) {
    try { await api(CFG.MEDIA, "/uploads/cancel", { method: "POST", body: { public_id: d.public_id } }); } catch {}
    return { ok: false, error: { status: 0, step: "network", data: { error: "network" } } };
  }
  if (!up.ok || !upData || !upData.public_id) {
    try { await api(CFG.MEDIA, "/uploads/cancel", { method: "POST", body: { public_id: d.public_id } }); } catch {}
    const msg = (upData && upData.error && (upData.error.message || upData.error)) || "upload failed";
    return {
      ok: false,
      error: { status: up.status, step: "cloudinary", data: { error: "cloudinary", message: typeof msg === "string" ? msg : "upload failed" } }
    };
  }
  return { ok: true, public_id: upData.public_id };
}

async function loadProducts(force) {
  if (S.products.loading) return;
  if (S.products.loaded && !force) return;
  S.products.loading = true; S.products.error = null;
  renderProducts();
  const r = await api(CFG.CATALOG, "/business/me/products");
  S.products.loading = false;
  if (!r.ok) S.products.error = r;
  else { S.products.data = r.data.products || r.data.items || []; S.products.loaded = true; }
  renderProducts();
}

/* ================= ORDERS ================= */
async function loadOrders(force) {
  if (S.orders.loading) return;
  if (S.orders.loaded && !force) return;
  S.orders.loading = true; S.orders.error = null;
  S.orders.cursor = null; S.orders.done = false;
  renderOrders();
  const q = new URLSearchParams({ limit: "20" });
  if (S.orders.filter) q.set("status", S.orders.filter);
  const r = await api(CFG.ORDERS, "/seller/orders?" + q);
  S.orders.loading = false;
  if (!r.ok) { S.orders.error = r; renderOrders(); return; }
  S.orders.data = r.data.orders || r.data.items || [];
  S.orders.cursor = r.data.next_cursor || null;
  S.orders.done = !S.orders.cursor;
  S.orders.loaded = true;
  renderOrders();
}
async function loadMoreOrders() {
  if (S.orders.loadingMore || S.orders.done) return;
  S.orders.loadingMore = true;
  const q = new URLSearchParams({ limit: "20" });
  if (S.orders.filter) q.set("status", S.orders.filter);
  if (S.orders.cursor) q.set("cursor", S.orders.cursor);
  const r = await api(CFG.ORDERS, "/seller/orders?" + q);
  S.orders.loadingMore = false;
  if (r.ok) {
    S.orders.data = (S.orders.data || []).concat(r.data.orders || r.data.items || []);
    S.orders.cursor = r.data.next_cursor || null;
    S.orders.done = !S.orders.cursor;
    renderOrders();
  } else toast(errMsg(r));
}

    if (e === "wrong_code") {

function openDisputeSheet(order) {
  openSheet(`
    <h2>Report a problem</h2>
    <p class="sub">Tell us what went wrong with this order.</p>
    <form id="dispForm" style="margin-top:12px" novalidate>
      <fieldset class="opts">

      </div>

        <button type="button" class="btn line full" data-close>Cancel</button>
      </div>
    </form>
  `);
  const form = $("dispForm");
  form.querySelectorAll(".opt").forEach(lbl => {
    lbl.addEventListener("click", () => {
      form.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === lbl));
      const r = lbl.querySelector('input[name="pick"]'); if (r) r.checked = true;
    });
  });
  const msg = $("dmsg"); const cnt = $("dc");
  msg.addEventListener("input", () => { cnt.textContent = String(msg.value.length); });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const er = $("der"); er.hidden = true;
    const checked = form.querySelector('input[name="pick"]:checked');
    if (!checked) { er.textContent = "Pick a reason."; er.hidden = false; return; }
    const reason = checked.closest(".opt").dataset.reason;
    const text = msg.value.trim();
    const body = { reason };
    if (text) body.message = text;
    const btn = $("dgo"); btn.disabled = true; btn.textContent = "Sending…";
    const r = await api(CFG.ORDERS, "/orders/" + encodeURIComponent(order.id || order.order_id) + "/dispute", { method: "POST", body });
    btn.disabled = false; btn.textContent = "Send report";
    if (r.ok) { closeSheet(); toast("Report sent"); await loadOrders(true); return; }
    const err = String(r.data && r.data.error);
    if (err === "dispute_already_open" || err === "already_disputed") er.textContent = ERR.dispute_already_open;
    else if (err === "not_disputable") er.textContent = ERR.not_disputable;
    else if (err === "invalid_reason") er.textContent = ERR.invalid_reason;
    else er.textContent = errMsg(r);
    er.hidden = false;
  });
}

/* ================= EARNINGS (adapted from referee.html) ================= */
const PO = {
  awaiting_confirmation: ["Needs your confirmation", "warn"],
  awaiting_approval: ["Waiting for approval", "warn"],
  ready_to_pay: ["Approved, being paid", "good"],
  paid: ["Paid", "good"],
  failed: ["Failed, money returned", "bad"],
  rejected: ["Rejected, money returned", "bad"],
  expired: ["Expired, money returned", "bad"]
};
function txInfo(e) {
  const r = String(e.reason || ""), c = e.direction === "C";
  switch (r) {
    case "referee_commission_pending": return c ? ["Commission earned (waiting for delivery)", true] : null;
    case "referee_cleared": return c ? ["Commission ready to withdraw", true] : null;
    case "referrer_commission_pending": return c ? ["Business referral earned (waiting for delivery)", true] : null;
    case "referrer_cleared": return c ? ["Business referral ready to withdraw", true] : null;
    case "withdrawal_reserve": return !c ? ["Withdrawal requested", false] : null;
    case "return_to_available": return c ? ["Withdrawal returned to your balance", true] : null;
    case "settle_reserved_withdrawal": return !c ? ["Withdrawal paid out", false] : null;
    case "release_referee": case "release_referrer": case "release_reserved_withdrawal": return null;
    default:
      if (r.startsWith("reverse_")) return !c ? ["Earning cancelled (order refunded)", false] : null;
      return [r.replace(/_/g, " ").replace(/^./, m => m.toUpperCase()), c];
  }
}

async function loadEarnings(force) {
  if (S.earn.loading) return;
  if (S.earn.loaded && !force) return;
  S.earn.loading = true; S.earn.error = null;
  renderEarnings();
  const [wal, pay, set, phone] = await Promise.all([
    api(CFG.LEDGER, "/wallet"),
    api(CFG.PAYOUTS, "/my-list"),
    api(CFG.PAYOUTS, "/settings"),
    api(CFG.VERIFY, "/phone")
  ]);
  S.earn.loading = false;
  if (!wal.ok || !set.ok) {
    S.earn.error = !wal.ok ? wal : set;
    renderEarnings();
    return;
  }
  S.earn.wallet = wal.data.balances || { available_ugx: 0, pending_ugx: 0, reserved_ugx: 0 };
  S.earn.entries = wal.data.entries || [];
  S.earn.next = wal.data.next_cursor || null;
  S.earn.settings = set.data || {};
  S.earn.payouts = pay.ok ? (pay.data.requests || []) : [];
  S.earn.phoneCount = phone.ok ? (phone.data.phones || []).length : null;
  S.earn.hold = phone.ok && phone.data.payout_hold_active ? phone.data.payout_hold_until : null;
  S.earn.loaded = true;
  renderEarnings();
}
async function loadMoreEarnings() {
  if (S.earn.loadingMore || !S.earn.next) return;
  S.earn.loadingMore = true;
  const r = await api(CFG.LEDGER, "/wallet?cursor=" + encodeURIComponent(S.earn.next));
  S.earn.loadingMore = false;
  if (r.ok) {
    S.earn.entries = S.earn.entries.concat(r.data.entries || []);
    S.earn.next = r.data.next_cursor || null;
    renderEarnings();
  } else toast(errMsg(r));
}

  else if (!S.me.phone_verified && S.earn.phoneCount === 0) { can = false; note = "Verify your phone number to withdraw."; }
  else if (w.available_ugx < min) { can = false; note = "You can withdraw once you have UGX " + fmt(min) + " available."; }
  else if ((S.earn.payouts || []).some(p => ["awaiting_confirmation", "awaiting_approval", "ready_to_pay"].includes(p.status))) { can = false; note = "You have a withdrawal in progress."; }
  const rows = (S.earn.entries || []).map(e => ({ e, i: txInfo(e) })).filter(x => x.i);

      ${note ? `<div class="banner" style="margin:12px 0 0">${esc(note)}${!S.me.phone_verified && S.earn.phoneCount === 0 ? ` <a href="/account.html?next=${THIS}">Verify now</a>` : ""}</div>` : ""}
      <div class="row" style="margin-top:10px"><button class="btn solid full" id="wd" ${can ? "" : "disabled"}><i class="fa-solid fa-money-bill-transfer"></i> Withdraw</button></div>
      ${st ? `<p class="sub" style="margin-top:8px;font-size:13px">Minimum UGX ${fmt(st.min_withdrawal_ugx)} · fee UGX ${fmt(st.fee_ugx)} · daily limit UGX ${fmt(st.per_user_daily_limit_ugx)}</p>` : ""}
    </div>

      <div class="hd"><h2>Withdrawals</h2></div>
      ${S.earn.payouts.map(p => {
        const [lb, cl] = PO[p.status] || [p.status, ""];

          <div class="m">You receive UGX ${fmt(p.net_ugx)} (fee UGX ${fmt(p.fee_ugx)}) · ${esc(dt(p.created_at))}</div>
          ${p.status === "awaiting_confirmation" ? `<div class="row"><button class="btn solid sm" data-confirm="${esc(p.id)}" data-amt="${Number(p.amount_ugx)}">Enter SMS code</button></div>` : ""}

      }).join("")}

      <div class="hd"><h2>Activity</h2></div>

  openSheet(`

    return;
  }
  const url = `https://earnityug.com/s/${b.subdomain}`;
  const approved = b.approval_status === "approved";
  el.innerHTML = `
    <div class="card">
      <h2>Your public store</h2>
      <p class="sub">Share this link with buyers.</p>
      <div class="store-link"><i class="fa-solid fa-globe"></i><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>
      ${!approved ? `<div class="banner" style="margin-top:12px">Your store link is live, but buyers won't see products until your business is approved.</div>` : ""}
      <div class="row" style="margin-top:12px">
        <button class="btn solid full" id="stCopy"><i class="fa-regular fa-copy"></i> Copy link</button>
        <button class="btn line full" id="stShare"><i class="fa-solid fa-share-nodes"></i> Share</button>
      </div>
    </div>
  `;
  $("stCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(url); toast("Link copied"); }
    catch { prompt("Copy your store link:", url); }
  };
  $("stShare").onclick = async () => {
    try {
      if (navigator.share) await navigator.share({ title: b.name || "Earnity store", url });
      else { await navigator.clipboard.writeText(url); toast("Link copied"); }
    } catch {}
  };
}

/* ================= RETRY DELEGATION ================= */
document.addEventListener("click", e => {
  const rt = e.target.closest("[data-retry]");
  if (rt) {
    const t = rt.dataset.retry;
    if (t === "overview") loadOverview(true);
    else if (t === "products") loadProducts(true);
    else if (t === "orders") loadOrders(true);
    else if (t === "earnings") loadEarnings(true);
    else if (t === "store") { S.store.loaded = false; loadStore(true); }
  }
});

/* ================= START ================= */
boot().catch(err => {
  console.error(err);
  $("loading").hidden = true;
  gate(`<div class="card"><h2>Couldn't start</h2><p class="sub">Please refresh the page.</p>
    <div class="row"><button class="btn solid" onclick="location.reload()">Refresh</button></div></div>`);
});
</script>
</body>
 </html>
